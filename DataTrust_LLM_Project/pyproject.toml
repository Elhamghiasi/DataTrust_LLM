[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "datatrust-llm"
version = "1.0.0"
description = "Analyze the relationship between source-data quality and LLM hallucination"
requires-python = ">=3.10"

[tool.setuptools.packages.find]
where = ["src"]
